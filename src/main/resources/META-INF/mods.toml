[[mods]]
modId="verity_mimo"
version="1.3.0"
displayName="Verity MiMo Addon"
authors="Enderman112"
description='''Adds Xiaomi MiMo TTS and ASR to Verity + Smiley's Better Voice without modifying either mod.

Features:
- MiMo TTS: takes over Verity's speech while Smiley's Better Voice is installed (toggle in this addon)
- MiMo ASR: takes over Verity's speech recognition (Chinese/English)
- Configure API key, voice, speed, style and language in this addon's own config screen

Built for Verity 6.0.0-beta.9 and Smiley's Better Voice 6.0.0-beta.9. Better Voice is optional:
use Verity-MiMo-Direct instead when you do not want it installed.
Get a MiMo API key at https://platform.xiaomimimo.com/#/console/api-keys'''

[[mixins]]
config="verity_mimo.mixins.json"

