[[mods]]
modId="verity_mimo"
version="1.2.0"
displayName="Verity MiMo Addon"
authors="Enderman112"
description='''Adds Xiaomi MiMo TTS and ASR to Verity + Smiley's Better Voice without modifying either mod.

Features:
- MiMo TTS: new "MIMO" provider option in Smiley's Better Voice (or enable the addon's own TTS toggle)
- MiMo ASR: new "MIMO" provider option in Verity speech recognition (Chinese/English)
- Configure API key, voice, speed, style and language in this addon's own config screen

Get a MiMo API key at https://platform.xiaomimimo.com/#/console/api-keys'''

[[mixins]]
config="verity_mimo.mixins.json"

